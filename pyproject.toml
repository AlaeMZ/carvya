[project]
name = "moroccan-car-prices"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alae", email = "yuziful572@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "lightgbm>=4.7.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "selectolax>=0.4.11",
    "shap>=0.51.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
moroccan-car-prices = "moroccan_car_prices:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
pythonpath = ["src", "src/models"]
testpaths = ["tests"]
