[project]
name = "moroccan-car-prices"
version = "0.1.0"
description = "Used-car price estimation for the Moroccan market from self-collected public listing data"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Alae", email = "alaemzi75@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "joblib>=1.5.3",
    "lightgbm>=4.7.0",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.52.4",
]

# Not an installable package: scripts and the app put src/ on sys.path
# themselves, so uv only needs to install the dependencies.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "seaborn>=0.13.2",
]
scraping = [
    "httpx>=0.28.1",
    "selectolax>=0.4.11",
]
training = [
    "pyarrow>=25.0.1",
    "shap>=0.51.0",
]

[tool.ruff]
# Notebooks are exploratory and not linted.
extend-exclude = ["*.ipynb"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "src/models"]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "app.main:app"
